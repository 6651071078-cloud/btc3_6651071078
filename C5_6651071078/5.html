<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <link rel="stylesheet" href="5.css">
</head>
<body>
    <main>
        <section class="form-card">
            <h1 class="title">Đăng ký tài khoản mới</h1>

            <form action="xu_ly_dangky.php" method="POST" enctype="multipart/form-data" name="formDangKy" id="formDangKy">
                
                <fieldset>
                    <legend>Thông tin cơ bản</legend>
                    <div class="form-row">
                        <label class="field-label" for="hoten">Họ và tên:</label>
                        <div class="field-input">
                            <input type="text" name="hoten" id="hoten" placeholder="Nguyễn Văn An" required maxlength="100">
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="field-label" for="email">Email:</label>
                        <div class="field-input">
                            <input type="email" name="email" id="email" placeholder="example@gmail.com" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="field-label" for="matkhau">Mật khẩu:</label>
                        <div class="field-input">
                            <input type="password" name="matkhau" id="matkhau" minlength="8" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="field-label" for="sdt">Số điện thoại:</label>
                        <div class="field-input">
                            <input type="tel" name="sdt" id="sdt" pattern="[0-9]{10}" placeholder="0901234567">
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Thông tin cá nhân</legend>
                    <div class="form-row">
                        <label class="field-label" for="tuoi">Tuổi:</label>
                        <div class="field-input">
                            <input type="number" name="tuoi" id="tuoi" min="16" max="99" step="1" value="18">
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="field-label" for="ngaysinh">Ngày sinh:</label>
                        <div class="field-input">
                            <input type="date" name="ngaysinh" id="ngaysinh" min="1950-01-01" max="2010-12-31" value="2005-01-01">
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="field-label">Giới tính:</label>
                        <div class="field-input radio-group">
                            <label><input type="radio" name="gioitinh" value="nam" checked> Nam</label>
                            <label><input type="radio" name="gioitinh" value="nu"> Nữ</label>
                            <label><input type="radio" name="gioitinh" value="khac"> Khác</label>
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="field-label" for="mauua">Màu yêu thích:</label>
                        <div class="field-input">
                            <input type="color" name="mauua" id="mauua" value="#FF6B6B">
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Sở thích &amp; Cài đặt</legend>
                    <div class="form-row">
                        <label class="field-label" for="soikim">Tìm kiếm sở thích:</label>
                        <div class="field-input">
                            <input type="search" name="soikim" id="soikim" placeholder="Ví dụ: đọc sách, chơi game...">
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="field-label" for="chitieu">Mức chi tiêu/tháng (VNĐ):</label>
                        <div class="field-input range-container">
                            <input type="text" id="chitieu_val" value="5.000.000" readonly>
                            <input type="range" name="chitieu" id="chitieu" min="0" max="50000000" step="500000" value="5000000" oninput="document.getElementById('chitieu_val').value = Number(this.value).toLocaleString('vi-VN')">
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="field-label">Sở thích (chọn nhiều):</label>
                        <div class="field-input checkbox-group">
                            <label><input type="checkbox" name="st_docsinh" value="doc" checked> Đọc sách</label>
                            <label><input type="checkbox" name="st_game" value="game"> Chơi game</label>
                            <label><input type="checkbox" name="st_du_lich" value="dulich"> Du lịch</label>
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="field-label" for="website">Website cá nhân:</label>
                        <div class="field-input">
                            <input type="url" name="website" id="website" placeholder="https://example.com">
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="field-label" for="avatar">Ảnh đại diện:</label>
                        <div class="field-input">
                            <input type="file" name="avatar" id="avatar" accept="image/png, image/jpeg">
                        </div>
                    </div>
                </fieldset>

                <div class="btn-group">
                    <input type="submit" value="Đăng ký ngay">
                    <input type="reset" value="Nhập lại">
                </div>
            </form>
        </section>
    </main>
</body>
</html>
